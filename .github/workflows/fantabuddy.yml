name: FantaBuddy

on:
  schedule:
    # Ogni 10 minuti: lo script decide da solo se e' il momento di scrivere.
    # Se rendi il repository privato, portalo a "*/30".
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gira:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
      APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
      APIFY_INPUT: ${{ secrets.APIFY_INPUT }}
      APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt

      # Dice subito quale pezzo non risponde, senza far fallire il resto
      - name: diagnosi
        continue-on-error: true
        run: python bot.py --diagnosi

      # Prova le fonti alternative di probabili formazioni.
      # Lancialo a mano da Actions quando serve; poi puoi cancellare il blocco.
      - name: sonda fonti
        continue-on-error: true
        if: github.event_name == 'workflow_dispatch'
        run: python sonda.py

      - name: messaggio delle sei ore prima
        run: python bot.py --pre

      - name: correzioni dalle formazioni ufficiali
        run: python bot.py --ufficiali

      # A turno concluso raccoglie gol e assist dei tuoi giocatori
      - name: rendimento di fine giornata
        continue-on-error: true
        run: python bot.py --rendimento

      - name: salva cosa ha gia' mandato
        if: always()
        run: |
          git config user.name  "fantabuddy"
          git config user.email "bot@users.noreply.github.com"
          git add stato.json rendimento.json || true
          git diff --staged --quiet || git commit -m "stato $(date -u +%F_%H:%M)"
          git push || true
