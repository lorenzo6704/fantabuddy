name: FantaBuddy

on:
  schedule:
    # Ogni 10 minuti: lo script decide da solo se e' il momento di scrivere.
    # Se rendi il repository privato, portalo a "*/30".
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write     # per ricommittare stato.json e rendimento.json
  actions: write      # per cancellare i giri vecchi

jobs:
  gira:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt

      # Dice quale pezzo non risponde, senza far fallire il resto
      - name: diagnosi
        continue-on-error: true
        run: python bot.py --diagnosi

      - name: messaggio delle sei ore prima
        run: python bot.py --pre

      - name: correzioni dalle formazioni ufficiali
        run: python bot.py --ufficiali

      # A turno concluso raccoglie gol e assist dei tuoi giocatori
      - name: rendimento di fine giornata
        continue-on-error: true
        run: python bot.py --rendimento

      - name: salva stato e rendimento
        if: always()
        run: |
          git config user.name  "fantabuddy"
          git config user.email "bot@users.noreply.github.com"
          git add stato.json rendimento.json || true
          git diff --staged --quiet || git commit -m "stato $(date -u +%F_%H:%M)"
          git push || true

      # Tiene solo il giro corrente e quello precedente, cancella il resto.
      # Attenzione: sparisce anche il log. Se stai cercando un errore, metti
      # un cancelletto davanti alle righe di questo blocco finche' non hai finito.
      - name: fai pulizia dei giri vecchi
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate \
            "repos/${{ github.repository }}/actions/workflows/fantabuddy.yml/runs?per_page=100" \
            --jq '.workflow_runs | sort_by(.created_at) | reverse | .[2:] | .[].id' \
          | while read -r id; do
              [ -n "$id" ] || continue
              if gh api -X DELETE "repos/${{ github.repository }}/actions/runs/$id" >/dev/null 2>&1
              then echo "cancellato $id"
              else echo "saltato $id (ancora in corso)"
              fi
            done
