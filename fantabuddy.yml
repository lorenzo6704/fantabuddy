name: FantaBuddy

on:
  schedule:
    # Ogni 10 minuti: lo script decide da solo se e' il momento di scrivere.
    # Serve stretto perche' le formazioni ufficiali escono un'ora prima del via.
    # Se rendi il repository privato, portalo a "*/30" per non consumare i
    # minuti gratuiti di GitHub Actions.
    - cron: "*/10 * * * *"
  workflow_dispatch:          # bottone "Run workflow" per provarlo a mano

permissions:
  contents: write             # serve per ricordarsi cosa ha gia' mandato

jobs:
  gira:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt

      - name: messaggio delle sei ore prima
        run: python bot.py --pre
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}

      - name: correzioni dalle formazioni ufficiali
        run: python bot.py --ufficiali
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}

      - name: salva cosa ha gia' mandato
        run: |
          git config user.name  "fantabuddy"
          git config user.email "bot@users.noreply.github.com"
          git add stato.json || true
          git diff --staged --quiet || git commit -m "stato $(date -u +%F_%H:%M)"
          git push || true
